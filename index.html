<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Architect Run</title>
<style>
  :root { --pill: rgba(28, 34, 50, .82); --accent: #8b6cff; --mint: #5fe0a6; --nova: #b9a4ff; --red: #ff3b5c; --gold: #ffc94a;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe2f3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .pill { background: var(--pill); border-radius: 999px; padding: 8px 14px; font-weight: 800;
    font-size: 13px; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  button { font: inherit; }
  .btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 900; font-size: 15px; letter-spacing: .04em;
    color: #fff; background: var(--accent); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .btn.alt { background: #46506e; } .btn.go { background: #3fbf6a; } .btn.nm { background: #c2185b; }

  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, -100%); padding: 3px 9px; font-size: 11px; white-space: nowrap; }
  .tag.me { outline: 2px solid var(--accent); }
  .tag small { display: none; }
  .tag .role { font-size: 9px; opacity: .65; letter-spacing: .08em; text-transform: uppercase; }
  .bubble { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%) scale(.6); opacity: 0; transition: opacity .15s, transform .15s;
    background: #fff; color: #2a2440; border-radius: 12px; padding: 5px 10px; font-size: 12px; font-weight: 900; white-space: nowrap; letter-spacing: 0; }
  .bubble::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; }
  .bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
  .bubble.urgent { background: #ffd23d; } .bubble.urgent::after { border-top-color: #ffd23d; }
  .tag.help { background: var(--red); }
  #pops { position: fixed; inset: 0; pointer-events: none; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.35);
    animation: pop 1s ease-out forwards; white-space: nowrap; }
  @keyframes pop { 0% { opacity: 0; margin-top: 10px; transform: translate(-50%,-50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    100% { opacity: 0; margin-top: -50px; transform: translate(-50%,-50%) scale(1); } }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  .playing #hud { display: block; }
  #hudL { position: absolute; top: calc(12px + var(--sat)); left: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #timer { font-size: 22px; font-variant-numeric: tabular-nums; }
  #timer.over { color: #ffb4c0; }
  #hudR { position: absolute; top: calc(12px + var(--sat)); right: 12px; display: flex; gap: 6px; pointer-events: auto; }
  #nova { position: absolute; top: calc(12px + var(--sat)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(340px, 44vw); }
  #novaBar { width: 100%; box-sizing: border-box; }
  #novaBar .lbl { color: var(--nova); white-space: nowrap; }
  #energy { flex: 1; height: 10px; background: rgba(255,255,255,.15); border-radius: 6px; overflow: hidden; }
  #energyFill { height: 100%; width: 0; background: linear-gradient(90deg, #8b6cff, #e48bff); border-radius: 6px; transition: width .1s; }
  #say { background: #fff; color: #2a2440; border-radius: 14px; padding: 8px 14px; font-weight: 800; font-size: 14px; max-width: 100%;
    text-align: center; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; }
  #say.on { opacity: 1; transform: none; }
  #say b { color: #7a55ff; }
  #prog { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + var(--sab)); width: min(420px, 60vw); height: 8px;
    background: rgba(28,34,50,.45); border-radius: 6px; }
  #prog i { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; }
  #prog i.cp { width: 4px; height: 12px; border: 0; border-radius: 2px; background: var(--mint); margin: -6px -2px; }
  #prog i.fin { width: 6px; height: 16px; border: 0; border-radius: 2px; background: #ff8ad8; margin: -8px -3px; right: 0; }
  #prog i.me { width: 16px; height: 16px; margin: -8px; z-index: 2; }
  #bonk { position: absolute; right: 22px; bottom: calc(150px + var(--sab)); }
  #help { position: absolute; bottom: calc(40px + var(--sab)); left: 50%; transform: translateX(-50%); font-weight: 700; font-size: 12px; opacity: .85;
    width: max-content; max-width: 86vw; text-align: center; transition: opacity .6s; }
  #help.gone { opacity: 0; }
  #lvlName { font-size: 11px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  #count { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 900;
    pointer-events: none; text-shadow: 0 6px 0 rgba(0,0,0,.25); color: #fff; }
  #count span { animation: pop2 .9s ease-out forwards; }
  @keyframes pop2 { 0% { transform: scale(2); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 100% { transform: scale(.8); opacity: 0; } }
  #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(255,40,80,.0); transition: box-shadow .15s; }

  /* touch */
  #touch { display: none; }
  .coarse.playing #touch { display: block; }
  .coarse #help { display: none; }
  #joy { position: fixed; left: 24px; bottom: calc(40px + var(--sab)); width: 130px; height: 130px; border-radius: 50%;
    background: rgba(28,34,50,.35); border: 2px solid rgba(255,255,255,.4); pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.85); }
  .tbtn { position: fixed; border-radius: 50%; background: var(--pill); border: 2px solid rgba(255,255,255,.4); pointer-events: auto;
    color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-direction: column; }
  #tJump { right: 24px; bottom: calc(40px + var(--sab)); width: 92px; height: 92px; font-size: 16px; }
  #tShoot { right: 40px; bottom: calc(146px + var(--sab)); width: 72px; height: 72px; overflow: hidden; font-size: 24px; }
  #tShoot small { font-size: 8px; letter-spacing: .06em; }
  #hits .h { color: #ff4f7b; font-size: 16px; } #hits .h.off { color: rgba(255,255,255,.2); }
  #powers { display: flex; gap: 6px; }
  .pw { position: relative; width: 38px; height: 38px; border-radius: 12px; background: var(--pill); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; border: 2px solid var(--c); }
  .pw i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); }
  .coinsLine { font-weight: 900; font-size: 18px; color: #ffd23d; } .coinsLine small { color: #fff; opacity: .6; font-size: 12px; }
  .btn:disabled { opacity: .4; }
  #tBonk { right: 128px; bottom: calc(36px + var(--sab)); width: 72px; height: 72px; overflow: hidden; }
  .cd { position: absolute; inset: 0; background: rgba(0,0,0,.55); transform-origin: bottom; transform: scaleY(0); }
  #bonkKey { position: relative; overflow: hidden; }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .screen.on { display: flex; }
  .card { background: rgba(28,34,50,.94); border-radius: 24px; padding: 22px 24px; width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
    text-align: center; box-shadow: 0 20px 60px rgba(20,30,60,.35); }
  .card h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .03em; }
  .card h3 { margin: 0; font-size: 12px; letter-spacing: .14em; opacity: .65; }
  .card p { margin: 10px 0; line-height: 1.4; }
  .quote { background: rgba(185,164,255,.14); border-left: 4px solid var(--nova); padding: 10px 12px; border-radius: 10px; text-align: left; font-weight: 700; }
  .quote b { color: var(--nova); }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .badge { display: inline-block; background: var(--gold); color: #3a2a00; font-weight: 900; border-radius: 999px; padding: 4px 10px; font-size: 12px; margin: 4px; }
  .stars { font-size: 46px; letter-spacing: 6px; margin: 8px 0; }
  .stars span { color: rgba(255,255,255,.18); display: inline-block; transition: transform .3s; }
  .stars span.on { color: var(--gold); animation: starIn .45s ease-out both; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: left; font-size: 13px; margin-top: 8px; }
  .facts div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 7px 10px; }
  .facts b { float: right; }
  .goals { text-align: left; font-size: 13px; margin: 8px 0 0; padding: 0; list-style: none; }
  .goals li { padding: 4px 0; } .goals li::before { content: '★ '; color: var(--gold); }

  #map { background: linear-gradient(180deg, rgba(160,190,240,.55), rgba(210,180,255,.55)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    flex-direction: column; justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  #mapTop { position: sticky; top: 0; width: 100%; box-sizing: border-box; padding: calc(14px + var(--sat)) 16px 10px; display: flex; gap: 8px; align-items: center; z-index: 2; }
  #mapTop .title { font-size: 22px; font-weight: 900; letter-spacing: .05em; color: #2a2440; margin-right: auto; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  #mapTop .title small { display: block; font-size: 11px; letter-spacing: .14em; opacity: .7; }
  #path { position: relative; width: min(420px, 100vw); margin: 0 auto 60px; flex-shrink: 0; }
  #path svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: #8b6cff; border: 4px solid #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 rgba(50,30,120,.35); }
  .node.lock { background: #9aa3b8; cursor: default; opacity: .8; font-size: 18px; }
  .node.done { background: #3fbf6a; }
  .node.next { animation: bob 1.2s ease-in-out infinite; background: #ff6f91; }
  .node.boss { width: 78px; height: 78px; margin: -39px; background: #2a2440; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .node .st { position: absolute; bottom: -20px; font-size: 14px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.4); white-space: nowrap; }
  .node .st .off { color: rgba(40,40,70,.3); text-shadow: none; }
  #nmBtn.on { background: #c2185b; outline: 2px solid #fff; }
  #pause { background: rgba(20,24,40,.35); }
  @media (max-width: 600px) {
    #nova { top: calc(56px + var(--sat)); width: 54vw; left: auto; right: 12px; transform: none; }
    #mapTop .title { font-size: 17px; } #mapTop .title small { font-size: 9px; }
    #mapTop .pill { padding: 7px 10px; font-size: 12px; }
    #nmBtn .t { display: none; }
  }
  #err { position: fixed; inset: 20px; background: #300; color: #fcc; padding: 16px; font: 12px monospace; white-space: pre-wrap; display: none; overflow: auto; z-index: 9; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>
<div id="pops"></div>
<div id="vignette"></div>

<div id="hud">
  <div id="hudL">
    <div class="pill" id="lvlName">LEVEL 1</div>
    <div class="pill" id="timer">0.0</div>
    <div id="powers"></div>
  </div>
  <div id="nova">
    <div class="pill" id="novaBar"><span class="lbl">✋ NOVA</span><div id="energy"><div id="energyFill"></div></div></div>
    <div id="say"></div>
  </div>
  <div id="hudR">
    <div class="pill" id="coins">🪙 0</div>
    <div class="pill" id="hits"></div>
    <button class="pill" id="pauseBtn" style="border:0;color:#fff;cursor:pointer">❚❚</button>
  </div>
  <div id="prog"></div>
  <div id="help" class="pill">WASD / arrows move · Space jump · F bonk · E shoot NOVA's hand · grab coins &amp; power-ups · 3 hits = knocked out · Esc pause</div>
</div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="tbtn" id="tJump">JUMP</div>
  <div class="tbtn" id="tBonk">BONK<div class="cd" id="tBonkCd"></div></div>
  <div class="tbtn" id="tShoot">🎯<small id="shotName">SHOOT</small><div class="cd" id="tShootCd"></div></div>
</div>
<div id="count"></div>

<div class="screen" id="map">
  <div id="mapTop">
    <div class="title">ARCHITECT RUN<small>ESCAPE NOVA'S HAND</small></div>
    <div class="pill" id="wallet">🪙 0</div>
    <button class="pill" id="muteBtn" style="border:0;color:#fff;cursor:pointer">🔊</button>
    <a class="pill" href="lab.html" style="color:#fff;text-decoration:none">🧪 LAB</a>
    <button class="pill" id="nmBtn" style="border:0;color:#fff;cursor:pointer">😈<span class="t"> NIGHTMARE</span></button>
  </div>
  <div id="path"></div>
</div>

<div class="screen" id="intro"><div class="card">
  <h3 id="iNum">LEVEL 1</h3><h1 id="iName">First Steps</h1>
  <div id="iBadges"></div>
  <p class="quote" id="iQuote"></p>
  <ul class="goals" id="iGoals"></ul>
  <div class="row"><button class="btn alt" id="iBack">MAP</button><button class="btn go" id="iPlay">RUN ▶</button></div>
</div></div>

<div class="screen" id="result"><div class="card">
  <h3 id="rNum">LEVEL 1</h3><h1 id="rTitle">ESCAPED!</h1>
  <div class="stars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
  <div class="coinsLine" id="rCoins"></div>
  <p class="quote" id="rQuote"></p>
  <div class="facts" id="rFacts"></div>
  <div class="row"><button class="btn alt" id="rMap">MAP</button><button class="btn alt" id="rRetry">RETRY</button><button class="btn nm" id="rContinue">CONTINUE</button><button class="btn go" id="rNext">NEXT ▶</button></div>
</div></div>

<div class="screen" id="pause"><div class="card">
  <h1>PAUSED</h1>
  <div class="row"><button class="btn alt" id="pMap">MAP</button><button class="btn alt" id="pRetry">RESTART</button><button class="btn go" id="pResume">RESUME</button></div>
</div></div>

<div id="err"></div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
